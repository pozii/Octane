# Octane — High-octane performance for your modpack.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
# Pin the Gradle JVM so IDEs with a wrong JAVA_HOME (e.g. JDK 8) still sync.
# WINDOWS-ONLY path: CI overrides it via -Dorg.gradle.java.home=$JAVA_HOME
# (see .github/workflows). Non-Windows contributors should point this at
# their local JDK 17+ or delete the line.
# Forward slashes required here (backslash is an escape in .properties).
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17.0.19.10-hotspot

# Mod identity
mod_id=octane
mod_name=Octane
mod_version=0.1.0-beta.1
mod_group_id=dev.pozii.octane
mod_authors=pozii
mod_license=Apache-2.0
mod_homepage=https://github.com/pozii/octane

# Active branch: Minecraft 1.20.1 on Fabric.
# Other branches live under versions/ and are wired in via stonecutter.gradle
# once the Stonecutter plugin migration happens (see that file).
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.16.14
fabric_api_version=0.92.2+1.20.1
loom_version=1.7.4
