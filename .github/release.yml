# GitHub auto-generated release notes: categorize by label, skip chores.
# GitHub appends a "New Contributors" section automatically.
changelog:
  exclude:
    labels:
      - chore
      - skip-changelog
    authors:
      - dependabot
  categories:
    - title: Breaking Changes
      labels:
        - breaking
    - title: New Features
      labels:
        - feat
        - feature
    - title: Performance
      labels:
        - perf
    - title: Bug Fixes
      labels:
        - fix
        - bug
    - title: Documentation
      labels:
        - docs
    - title: Other Changes
      labels:
        - "*"
