# Octane autonomous release — tag push -> build -> GitHub Release + Modrinth.
#
# Tag scheme: v<mod_version>-mc<mc_version> (e.g. v0.1.0-beta.1-mc1.20.1).
# The tag is validated against gradle.properties; mismatches fail fast.
# Tags containing -alpha/-beta/-rc ship as prerelease (GitHub) + beta (Modrinth).
# The Modrinth step is skipped when the MODRINTH_TOKEN secret is absent,
# so GitHub-only releases always work.
name: Release

on:
  push:
    tags: ['v*-mc*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must match v<mod_version>-mc<mc_version>)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve tag and versions
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          MOD_VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          MC_VERSION="$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)"
          case "${TAG}" in
            "v${MOD_VERSION}-mc${MC_VERSION}") ;;
            *)
              echo "::error::Tag ${TAG} does not match gradle.properties (v${MOD_VERSION}-mc${MC_VERSION})"
              exit 1
              ;;
          esac
          case "${TAG}" in
            *-alpha*|*-beta*|*-rc*) TYPE=beta ;;
            *) TYPE=release ;;
          esac
          echo "mod_version=${MOD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "mc_version=${MC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_type=${TYPE}" >> "$GITHUB_OUTPUT"
          echo "Tag ${TAG} -> ${TYPE}"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew :fabric:build --console=plain
      - name: Publish to GitHub
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ steps.meta.outputs.tag }}
          github-prerelease: ${{ steps.meta.outputs.version_type != 'release' }}
          files: fabric/build/libs/octane-*.jar
          name: Octane ${{ steps.meta.outputs.mod_version }} for Minecraft ${{ steps.meta.outputs.mc_version }}
          version: ${{ steps.meta.outputs.tag }}
          version-type: ${{ steps.meta.outputs.version_type }}
          changelog-file: CHANGELOG.md
          loaders: fabric
          game-versions: ${{ steps.meta.outputs.mc_version }}
          java: '17'
          dependencies: |
            fabric-api
            fabricloader
      - name: Publish to Modrinth
        if: ${{ secrets.MODRINTH_TOKEN != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: octane
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: fabric/build/libs/octane-*.jar
          name: Octane ${{ steps.meta.outputs.mod_version }} for Minecraft ${{ steps.meta.outputs.mc_version }}
          version: ${{ steps.meta.outputs.tag }}
          version-type: ${{ steps.meta.outputs.version_type }}
          changelog-file: CHANGELOG.md
          loaders: fabric
          game-versions: ${{ steps.meta.outputs.mc_version }}
          java: '17'
          dependencies: |
            fabric-api
            fabricloader
