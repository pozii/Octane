# Octane autonomous release — tag push -> build -> GitHub Release + Modrinth.
#
# Tag scheme: v<mod_version>-mc<mc_version> (e.g. v0.1.0-beta.1-mc1.20.1).
# The tag is validated against gradle.properties; mismatches fail fast.
# Tags containing -alpha/-beta/-rc ship as prerelease (GitHub) + beta (Modrinth).
# The Modrinth step is skipped when the MODRINTH_TOKEN secret is absent,
# so GitHub-only releases always work. Manual release = push a tag.
name: Release

on:
  push:
    tags:
      - 'v*-mc*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve tag and versions
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          MOD_VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          MC_VERSION="$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)"
          case "${TAG}" in
            "v${MOD_VERSION}-mc${MC_VERSION}") ;;
            *)
              echo "::error::Tag ${TAG} does not match gradle.properties (v${MOD_VERSION}-mc${MC_VERSION})"
              exit 1
              ;;
          esac
          case "${TAG}" in
            *-alpha*|*-beta*|*-rc*) TYPE=beta ;;
            *) TYPE=release ;;
          esac
          echo "mod_version=${MOD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "mc_version=${MC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_type=${TYPE}" >> "$GITHUB_OUTPUT"
          echo "Tag ${TAG} -> ${TYPE}"
      - name: Check secrets
        id: secrets
        run: |
          if [ -n "${{ secrets.MODRINTH_TOKEN }}" ]; then
            echo "modrinth=true" >> "$GITHUB_OUTPUT"
          else
            echo "modrinth=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # -Dorg.gradle.java.home overrides the Windows-only pin in
      # gradle.properties so CI uses the setup-java toolchain.
      - name: Build
        run: ./gradlew :fabric:build -Dorg.gradle.java.home=$JAVA_HOME --console=plain
      - name: Publish to GitHub
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ steps.meta.outputs.tag }}
          github-prerelease: ${{ steps.meta.outputs.version_type != 'release' }}
          files: fabric/build/libs/octane-*.jar
          name: Octane ${{ steps.meta.outputs.mod_version }} for Minecraft ${{ steps.meta.outputs.mc_version }}
          version: ${{ steps.meta.outputs.tag }}
          version-type: ${{ steps.meta.outputs.version_type }}
          loaders: fabric
          game-versions: ${{ steps.meta.outputs.mc_version }}
          java: '17'
          dependencies: |
            fabric-api
            fabricloader
      - name: Publish to Modrinth
        # Tolerated until the Modrinth project clears review: the step fails
        # with 401 while the project is unapproved, which must not fail the
        # whole release. Remove once the first Modrinth version lands.
        continue-on-error: true
        if: steps.secrets.outputs.modrinth == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: octane
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: fabric/build/libs/octane-*.jar
          name: Octane ${{ steps.meta.outputs.mod_version }} for Minecraft ${{ steps.meta.outputs.mc_version }}
          version: ${{ steps.meta.outputs.tag }}
          version-type: ${{ steps.meta.outputs.version_type }}
          loaders: fabric
          game-versions: ${{ steps.meta.outputs.mc_version }}
          java: '17'
          dependencies: |
            fabric-api
            fabricloader
